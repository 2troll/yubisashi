<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Yubisashi 指さし会話</title>
  <meta name="theme-color" content="#1f5f5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Yubisashi — 指さし会話シート for Japanese restaurant & hotel staff and Muslim guests">
  <style>
    :root {
      --accent: #1f5f5b;
      --accent-hover: #174744;
      --accent-soft: rgba(31, 95, 91, 0.12);
      --bg: #fbf8f2;
      --card-bg: #ffffff;
      --ink: #1d1f22;
      --ink-muted: #5a6068;
      --border: #e3ded6;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      --font-base: "Hiragino Sans", "Noto Sans JP", system-ui, -apple-system, sans-serif;
      --font-ar: "Geeza Pro", "Noto Naskh Arabic", "Amiri", serif, system-ui;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #3da19c;
        --accent-hover: #50b5b0;
        --accent-soft: rgba(61, 161, 156, 0.2);
        --bg: #15181b;
        --card-bg: #21262c;
        --ink: #f0f2f5;
        --ink-muted: #a3acb9;
        --border: #333a42;
        --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-base);
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 920px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100vh;
    }

    header.top-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-wrap h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .title-wrap p {
      font-size: 0.85rem;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .mode-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 2px solid var(--accent);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 48px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .mode-toggle-btn:active {
      transform: scale(0.97);
    }

    .lang-selector-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lang-selector-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .lang-switch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .lang-btn {
      min-height: 48px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      color: var(--ink);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      padding: 8px 4px;
      text-align: center;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lang-btn[data-lang="ar"] {
      font-family: var(--font-ar);
      font-size: 1.15rem;
      direction: rtl;
    }

    .lang-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(31, 95, 91, 0.3);
    }

    main.phrases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      flex: 1;
    }

    @media (min-width: 680px) {
      main.phrases-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
    }

    .phrase-card {
      min-height: 96px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.12s ease, border-color 0.12s ease;
      width: 100%;
    }

    .phrase-card:active {
      transform: scale(0.97);
      border-color: var(--accent);
    }

    .phrase-card .primary-text {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ink);
      word-break: break-word;
    }

    .phrase-card .secondary-preview {
      font-size: 0.8rem;
      color: var(--ink-muted);
      line-height: 1.3;
      margin-top: 8px;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .phrase-card[data-guest-dir="rtl"] .secondary-preview {
      font-family: var(--font-ar);
      direction: rtl;
      text-align: right;
      align-self: stretch;
      font-size: 0.9rem;
    }

    .phrase-card.reverse-mode .primary-text[data-lang="ar"] {
      font-family: var(--font-ar);
      direction: rtl;
      text-align: right;
      align-self: stretch;
      font-size: 1.15rem;
    }

    /* Modal Fullscreen */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--card-bg);
      color: var(--ink);
      width: 100%;
      max-width: 960px; min-height: 70vh; justify-content: center;
      border-radius: 24px;
      padding: 28px 22px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--accent-soft);
      color: var(--ink);
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .modal-hero-text {
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      font-weight: 800;
      line-height: 1.35;
      text-align: center;
      margin: 20px 0 16px;
      color: var(--ink);
      word-break: break-word;
      width: 100%;
    }

    .modal-hero-text.arabic {
      font-family: var(--font-ar);
      direction: rtl;
      font-size: clamp(2.6rem, 8.5vw, 5rem);
      line-height: 1.5;
    }

    .modal-divider {
      width: 48px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin-bottom: 16px;
    }

    .modal-sub-text {
      font-size: 1.25rem;
      color: var(--ink-muted);
      text-align: center;
      line-height: 1.4;
      margin-bottom: 24px;
      font-weight: 600;
      word-break: break-word;
      width: 100%;
    }

    .modal-sub-text.arabic {
      font-family: var(--font-ar);
      direction: rtl;
      font-size: 1.35rem;
    }

    .modal-audio-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .speak-btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      min-width: 72px;
      min-height: 72px;
      padding: 0 24px;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(31, 95, 91, 0.4);
      transition: transform 0.12s, background 0.15s;
    }

    .speak-btn:active {
      transform: scale(0.94);
      background: var(--accent-hover);
    }

    .speak-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink-muted);
    }

    .no-voice-note {
      font-size: 0.82rem;
      color: var(--ink-muted);
      background: var(--accent-soft);
      padding: 6px 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    footer.site-footer {
      margin-top: auto;
      padding: 20px 8px 12px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--ink-muted);
      line-height: 1.5;
    }

    footer.site-footer a {
      color: var(--accent);
      text-decoration: underline;
      word-break: break-all;
    }
    .dish-card { border-left: 6px solid var(--accent); }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="header-main">
        <div class="title-wrap">
          <h1>Yubisashi — 指さし会話</h1>
          <p id="subTitleStatus">スタッフ向け / Japanese Staff → Guest</p>
        </div>
        <button type="button" id="modeToggleBtn" class="mode-toggle-btn" aria-pressed="false">
          <span id="modeToggleIcon">🔄</span>
          <span id="modeToggleLabel">お客様用 / للضيف</span>
        </button>
      </div>

      <div class="lang-selector-group">
        <div class="lang-selector-label">Guest Language / ゲストの言語</div>
        <div class="lang-switch" role="radiogroup" aria-label="Guest language selector">
          <button type="button" class="lang-btn" data-lang="ar" role="radio" aria-checked="false">
            العربية
          </button>
          <button type="button" class="lang-btn" data-lang="en" role="radio" aria-checked="false">
            English
          </button>
          <button type="button" class="lang-btn" data-lang="id" role="radio" aria-checked="false">
            Bahasa Indonesia
          </button>
        </div>
      </div>
    </header>

    <main class="phrases-grid" id="phrasesGrid" aria-label="Phrases list"></main>

    <footer class="site-footer">
      お店用のメニュー翻訳・会話シートのご相談：<a href="mailto:tony@tonykansaiguide.com">tony@tonykansaiguide.com</a>
    </footer>
  </div>

  <!-- Fullscreen Display Modal -->
  <div class="modal-overlay" id="phraseModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content" id="modalCard">
      <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="閉じる ✕">✕</button>
      
      <div class="modal-hero-text" id="modalHeroText"></div>
      <div class="modal-divider"></div>
      <div class="modal-sub-text" id="modalSubText"></div>
      
      <div class="modal-audio-wrap">
        <button type="button" class="speak-btn" id="modalSpeakBtn" aria-label="発音を再生">
          🔊
        </button>
        <span class="speak-label" id="speakLabel">もう一度聞く / Play audio</span>
        <span class="no-voice-note" id="noVoiceNote">この端末には音声がありません</span>
      </div>
    </div>
  </div>

  <script>
    // generar.py sustituye esta línea por el nombre y los platos de cada cliente.
    const TIENDA = {
  "nombre": "見本食堂（サンプル）",
  "platos": [
    {
      "ja": "鶏白湯ラーメン（鶏肉・ハラール認証の肉・豚肉不使用・アルコール不使用）",
      "ar": "رامن بمرق الدجاج — دجاج، لحم حلال معتمد، بدون لحم خنزير، بدون كحول",
      "en": "Chicken broth ramen — chicken, halal-certified meat, no pork, no alcohol",
      "id": "Ramen kuah ayam — ayam, daging bersertifikat halal, tanpa babi, tanpa alkohol"
    },
    {
      "ja": "和牛すき焼き（牛肉・ハラール認証の肉・豚肉不使用・アルコール不使用）",
      "ar": "سوكي ياكي بلحم الواغيو — لحم بقري، لحم حلال معتمد، بدون لحم خنزير، بدون كحول",
      "en": "Wagyu sukiyaki — beef, halal-certified meat, no pork, no alcohol",
      "id": "Sukiyaki wagyu — daging sapi, daging bersertifikat halal, tanpa babi, tanpa alkohol"
    },
    {
      "ja": "海鮮丼（魚介類あり・アルコール不使用）",
      "ar": "أرز مع مأكولات بحرية — يحتوي على مأكولات بحرية، بدون كحول",
      "en": "Seafood rice bowl — contains seafood, no alcohol",
      "id": "Nasi mangkuk makanan laut — mengandung makanan laut, tanpa alkohol"
    },
    {
      "ja": "野菜天ぷら（肉・魚不使用・アルコール不使用）",
      "ar": "تمبورا الخضار — بدون لحم ولا سمك، بدون كحول",
      "en": "Vegetable tempura — no meat or fish, no alcohol",
      "id": "Tempura sayuran — tanpa daging dan ikan, tanpa alkohol"
    },
    {
      "ja": "ピリ辛から揚げ（鶏肉・ハラール認証の肉・辛い・アルコール不使用）",
      "ar": "دجاج مقلي ياباني حار — دجاج، لحم حلال معتمد، حار، بدون كحول",
      "en": "Spicy Japanese fried chicken — chicken, halal-certified meat, spicy, no alcohol",
      "id": "Ayam goreng Jepang pedas — ayam, daging bersertifikat halal, pedas, tanpa alkohol"
    }
  ]
};

    const PHRASES = [
      { ja: "豚肉は使っていません", ar: "لا يحتوي على لحم خنزير", en: "No pork", id: "Tidak mengandung babi" },
      { ja: "アルコール（みりん・酒）は使っていません", ar: "لا يحتوي على كحول (ولا ميرين ولا ساكي)", en: "No alcohol (no mirin, no sake)", id: "Tidak mengandung alkohol (tanpa mirin dan sake)" },
      { ja: "ハラール認証の肉です", ar: "اللحم حلال ومعتمد", en: "Halal-certified meat", id: "Daging bersertifikat halal" },
      { ja: "この料理は魚介類を使っています", ar: "هذا الطبق يحتوي على مأكولات بحرية", en: "Contains seafood", id: "Mengandung makanan laut" },
      { ja: "アレルギーはありますか？", ar: "هل لديك حساسية من أي طعام؟", en: "Any allergies?", id: "Apakah Anda punya alergi makanan?" },
      { ja: "辛さは大丈夫ですか？", ar: "هل تحب الطعام الحار؟", en: "Is spicy OK?", id: "Apakah boleh pedas?" },
      { ja: "お水をどうぞ", ar: "تفضل الماء", en: "Here is some water", id: "Silakan, air minum" },
      { ja: "少々お待ちください", ar: "لحظة من فضلك", en: "One moment, please", id: "Mohon tunggu sebentar" },
      { ja: "お祈りのスペースがあります", ar: "يوجد مكان للصلاة", en: "There is a prayer space", id: "Ada tempat untuk salat" },
      { ja: "キブラ（メッカの方向）はこちらです", ar: "القبلة في هذا الاتجاه", en: "Qibla is this way", id: "Arah kiblat ke sini" },
      { ja: "お会計はこちらです", ar: "الحساب من هنا", en: "Pay here", id: "Silakan bayar di sini" },
      { ja: "カード・QR決済が使えます", ar: "يمكنك الدفع بالبطاقة أو رمز QR", en: "Card and QR payment accepted", id: "Bisa bayar dengan kartu atau QR" },
      { ja: "何名様ですか？", ar: "كم عدد الأشخاص؟", en: "How many people?", id: "Berapa orang?" },
      { ja: "おすすめはこちらです", ar: "هذا هو الطبق المميز عندنا", en: "This is our recommendation", id: "Ini menu rekomendasi kami" },
      { ja: "持ち帰りできます", ar: "يمكن أخذ الطعام معك", en: "Takeaway available", id: "Bisa dibawa pulang" },
      { ja: "ありがとうございました", ar: "شكرًا لزيارتكم", en: "Thank you for coming", id: "Terima kasih atas kunjungan Anda" }
    ];

    // Versión de cliente: sus platos van primero y el título lleva su nombre.
    if (TIENDA) {
      PHRASES.unshift(...TIENDA.platos.map((p) => ({ ...p, plato: true })));
      document.title = TIENDA.nombre + " — 指さし会話";
      document.querySelector(".title-wrap h1").textContent = TIENDA.nombre;
    }

    const STORAGE_KEY = "yubisashi_guest_lang";
    let currentLang = "ar";
    let isReverseMode = false; // false = staff mode (shows JA first), true = guest mode (shows guest lang first)
    let currentPhrase = null;
    let availableVoices = [];

    function initVoices() {
      if ("speechSynthesis" in window) {
        availableVoices = window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          availableVoices = window.speechSynthesis.getVoices();
        };
      }
    }

    function getStoredLang() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && ["ar", "en", "id"].includes(saved)) {
          return saved;
        }
      } catch (e) {
        // Storage access might fail in private browsing; silently fallback
      }
      return "ar";
    }

    function setStoredLang(lang) {
      currentLang = lang;
      try {
        localStorage.setItem(STORAGE_KEY, lang);
      } catch (e) {}
      updateLangUI();
      renderPhrases();
    }

    function updateLangUI() {
      document.querySelectorAll(".lang-btn").forEach(btn => {
        const isMatch = btn.dataset.lang === currentLang;
        btn.classList.toggle("active", isMatch);
        btn.setAttribute("aria-checked", isMatch ? "true" : "false");
      });
    }

    function renderPhrases() {
      const grid = document.getElementById("phrasesGrid");
      grid.innerHTML = "";

      PHRASES.forEach((phrase, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "phrase-card" + (isReverseMode ? " reverse-mode" : "") + (phrase.plato ? " dish-card" : "");
        
        const primaryText = isReverseMode ? phrase[currentLang] : phrase.ja;
        const secondaryText = isReverseMode ? phrase.ja : phrase[currentLang];
        const primaryLang = isReverseMode ? currentLang : "ja";

        if (!isReverseMode && currentLang === "ar") {
          btn.setAttribute("data-guest-dir", "rtl");
        } else {
          btn.removeAttribute("data-guest-dir");
        }

        const primaryEl = document.createElement("div");
        primaryEl.className = "primary-text";
        primaryEl.setAttribute("data-lang", primaryLang);
        primaryEl.textContent = primaryText;

        const secondaryEl = document.createElement("div");
        secondaryEl.className = "secondary-preview";
        secondaryEl.textContent = secondaryText;

        btn.appendChild(primaryEl);
        btn.appendChild(secondaryEl);

        btn.addEventListener("click", () => openModal(phrase));
        grid.appendChild(btn);
      });
    }

    function findVoice(targetPrefix) {
      if (!("speechSynthesis" in window)) return null;
      if (!availableVoices || availableVoices.length === 0) {
        availableVoices = window.speechSynthesis.getVoices();
      }
      const lower = targetPrefix.toLowerCase();
      return availableVoices.find(v => v.lang && v.lang.toLowerCase().startsWith(lower)) || null;
    }

    function speakText(text, targetPrefix) {
      if (!("speechSynthesis" in window)) return false;
      try {
        window.speechSynthesis.cancel();
        const voice = findVoice(targetPrefix);
        const utterance = new SpeechSynthesisUtterance(text);
        if (voice) {
          utterance.voice = voice;
          utterance.lang = voice.lang;
        } else {
          // Map default locales
          if (targetPrefix === "ar") utterance.lang = "ar-SA";
          else if (targetPrefix === "en") utterance.lang = "en-US";
          else if (targetPrefix === "id") utterance.lang = "id-ID";
          else if (targetPrefix === "ja") utterance.lang = "ja-JP";
        }
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
        return true;
      } catch (err) {
        return false;
      }
    }

    function openModal(phrase) {
      currentPhrase = phrase;
      const modal = document.getElementById("phraseModal");
      const hero = document.getElementById("modalHeroText");
      const sub = document.getElementById("modalSubText");
      const speakBtn = document.getElementById("modalSpeakBtn");
      const speakLabel = document.getElementById("speakLabel");
      const noVoiceNote = document.getElementById("noVoiceNote");

      let heroText = "";
      let subText = "";
      let speakVoiceLang = "";
      let speakPhrase = "";

      if (!isReverseMode) {
        // Normal Staff Mode: Guest text is HUGE
        heroText = phrase[currentLang];
        subText = phrase.ja;
        speakVoiceLang = currentLang;
        speakPhrase = phrase[currentLang];

        hero.classList.toggle("arabic", currentLang === "ar");
        hero.setAttribute("dir", currentLang === "ar" ? "rtl" : "ltr");
        sub.classList.remove("arabic");
        sub.removeAttribute("dir");
      } else {
        // Reverse Guest Mode: Japanese text is HUGE for staff
        heroText = phrase.ja;
        subText = phrase[currentLang];
        speakVoiceLang = "ja";
        speakPhrase = phrase.ja;

        hero.classList.remove("arabic");
        hero.removeAttribute("dir");
        sub.classList.toggle("arabic", currentLang === "ar");
        sub.setAttribute("dir", currentLang === "ar" ? "rtl" : "ltr");
      }

      hero.textContent = heroText;
      // Los platos con etiquetas son frases largas: a tamaño completo no caben.
      hero.style.fontSize = heroText.length > 28 ? "clamp(1.6rem, 4.5vw, 2.8rem)" : "";
      sub.textContent = subText;

      // Check voice capability
      const voice = findVoice(speakVoiceLang);
      if (!("speechSynthesis" in window) || !voice) {
        speakBtn.style.display = "none";
        speakLabel.style.display = "none";
        noVoiceNote.style.display = "inline-block";
      } else {
        speakBtn.style.display = "flex";
        speakLabel.style.display = "inline-block";
        noVoiceNote.style.display = "none";
      }

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");

      // Auto-speak once when opened
      if (voice) {
        speakText(speakPhrase, speakVoiceLang);
      }
    }

    function closeModal() {
      const modal = document.getElementById("phraseModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
      currentPhrase = null;
    }

    function setupListeners() {
      // Language switcher
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const lang = btn.dataset.lang;
          setStoredLang(lang);
        });
      });

      // Reverse Mode toggle
      const modeToggleBtn = document.getElementById("modeToggleBtn");
      const subTitleStatus = document.getElementById("subTitleStatus");
      const modeToggleLabel = document.getElementById("modeToggleLabel");

      modeToggleBtn.addEventListener("click", () => {
        isReverseMode = !isReverseMode;
        modeToggleBtn.setAttribute("aria-pressed", isReverseMode ? "true" : "false");

        if (isReverseMode) {
          modeToggleLabel.textContent = "スタッフ用 / Staff";
          subTitleStatus.textContent = "お客様用 / Guest → Staff";
        } else {
          modeToggleLabel.textContent = "お客様用 / للضيف";
          subTitleStatus.textContent = "スタッフ向け / Japanese Staff → Guest";
        }
        renderPhrases();
      });

      // Modal speech button
      const speakBtn = document.getElementById("modalSpeakBtn");
      speakBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!currentPhrase) return;
        const speakVoiceLang = isReverseMode ? "ja" : currentLang;
        const text = isReverseMode ? currentPhrase.ja : currentPhrase[currentLang];
        speakText(text, speakVoiceLang);
      });

      // Close modal on close button
      document.getElementById("modalCloseBtn").addEventListener("click", closeModal);

      // Close modal on backdrop click
      const modal = document.getElementById("phraseModal");
      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          closeModal();
        }
      });

      // Close modal on Escape
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("open")) {
          closeModal();
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initVoices();
      currentLang = getStoredLang();
      updateLangUI();
      renderPhrases();
      setupListeners();
    });
  </script>
</body>
</html>
